# Removes one book from this subject site and opens a pull request.
#
# Run it by hand (Actions > Remove a book > Run workflow) and give the book's
# id or its book repo name. It decrypts index.enc with the secret SUBJECT_KEY,
# drops that book, deletes the pool files no other book uses, and opens a
# pull request. Nothing changes until you merge the pull request.
#
# This file names no book: the id is typed at run time and kept out of the
# commit message, branch name and pull request text, because this repo is
# public and so is its history. Needs Settings > Actions > General > "Allow
# GitHub Actions to create and approve pull requests". The tool comes from
# the item UI at the tag in .itemrc, like the check workflow.
name: Remove a book

on:
  workflow_dispatch:
    inputs:
      book:
        description: Book id (or book repo name) to remove
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remove-book
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the tool
        run: |
          set -euo pipefail
          tag=$(head -n1 .itemrc | tr -d '[:space:]')
          case "$tag" in ''|*[!0-9.]*) echo "::error::.itemrc must hold an exact tag"; exit 1;; esac
          git clone --quiet --depth 1 --branch "$tag" https://github.com/eckko/item-ui "$RUNNER_TEMP/ui"
          pip install --quiet cryptography

      - name: Remove the book
        env:
          SUBJECT_KEY: ${{ secrets.SUBJECT_KEY }}
          BOOK: ${{ inputs.book }}
        run: |
          set -euo pipefail
          [ -n "$SUBJECT_KEY" ] || { echo "::error::The secret SUBJECT_KEY is not set"; exit 1; }
          python3 "$RUNNER_TEMP/ui/tools/site/build_pool.py" --site . --remove "$BOOK"
          git status --short | sed 's#^\(...\).*#\1 (file)#' | sort | uniq -c

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "::error::Nothing changed: no book matched that id or name."; exit 1
          fi
          branch="chore/update-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Update"
          git push -q origin "$branch"
          gh pr create --base "$(git rev-parse --abbrev-ref origin/HEAD | sed 's#origin/##')" --head "$branch" \
            --title "Update" --body "Removes one book from the site. Merge to publish." \
            --assignee "$GITHUB_REPOSITORY_OWNER"
